<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ooui &middot; WebAssembly</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1826;
      --panel: #172238;
      --panel-edge: #253350;
      --text: #eef2f9;
      --muted: #6f7990;
      --accent: #6854d9;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: radial-gradient(1200px 600px at 15% -10%, #1d2b47 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.55;
      padding: 48px 24px 64px;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .08em;
      text-transform: uppercase;
      z-index: 10;
    }

    #loading[hidden] {
      display: none;
    }

    .page {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .18em;
    }

    .title {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.15;
      font-weight: 700;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      max-width: 60ch;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--panel-edge);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-title {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    .card-text {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 4px;
    }

    .button {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .08s ease, filter .12s ease;
    }

    .button:active {
      transform: translateY(1px);
    }

    .button.primary {
      background: var(--accent);
      color: #fff;
    }

    .button.primary:hover {
      filter: brightness(1.12);
    }

    .button.ghost {
      background: transparent;
      border-color: var(--panel-edge);
      color: var(--text);
    }

    .button.ghost:hover {
      border-color: var(--muted);
    }

    .count {
      min-width: 3ch;
      text-align: center;
      font-size: 28px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--panel-edge);
      background: #101a2b;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }

    .input:focus {
      border-color: var(--accent);
    }

    .greeting {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .list {
      margin: 0;
      padding-left: 20px;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .footer {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="loading">Starting .NET</div>
  <script src="ooui-client.js"></script>
  <script type="module" src="main.js"></script>
</body>

</html>
